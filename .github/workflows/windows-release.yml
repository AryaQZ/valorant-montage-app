name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release (requires running on a tag or creates prerelease)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Python 3.11 for tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: npm ci

      - name: Prepare bundled Python runtime (no user Python install required)
        shell: pwsh
        run: .\scripts\prepare-bundled-python.ps1 -Force

      - name: Run Python and desktop test suite
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Build Windows x64 installer and downloadable ZIP
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valorant-montage-studio-windows-x64
          path: |
            apps/desktop/release/VALORANT-Montage-Studio-*-Windows-x64.zip
            apps/desktop/release/VALORANT-Montage-Studio-*-Windows-x64.exe
            apps/desktop/release/SHA256SUMS.txt

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Download & Install (Windows 10/11 64-bit)

            1. Download **`VALORANT-Montage-Studio-*-Windows-x64.zip`** below and extract it.
            2. Run **`VALORANT-Montage-Studio-*-Windows-x64.exe`** to install (the Python worker runtime is bundled — **no Python installation required**).
            3. If FFmpeg is not yet installed on your PC, double-click **`Install-FFmpeg.bat`** inside the extracted folder, then launch **VALORANT Montage Studio**.

            > **Note:** This free/noncommercial build is currently unsigned. If Windows SmartScreen prompts, click **More info → Run anyway** after verifying `SHA256SUMS.txt`.
          files: |
            apps/desktop/release/VALORANT-Montage-Studio-*-Windows-x64.zip
            apps/desktop/release/VALORANT-Montage-Studio-*-Windows-x64.exe
            apps/desktop/release/SHA256SUMS.txt
